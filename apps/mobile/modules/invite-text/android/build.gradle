plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.invitetext'
version = '1.0.0'

android {
  namespace "expo.modules.invitetext"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled models (about 4 MB each per CPU architecture), so scanning works offline from
  // the first launch. Invite cards mix Hindi and English, so both scripts are read.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
}
